name: Development Workflow
on:
    push:
        branches:
            - dev
    workflow_dispatch:
jobs:
    leakscan:
        runs-on: self-hosted
        steps:
          - name: Get code
            uses: actions/checkout@v4
          - uses: gitleaks/gitleaks-action@v2
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE}}
    trivyfs:
        needs: leakscan
        runs-on: self-hosted
        steps:
          - name: Checkout code
            uses: actions/checkout@v4
          - name: Run Trivy vulnerability scanner in fs mode for frontend
            uses: aquasecurity/trivy-action@0.28.0
            with:
              scan-type: 'fs'
              scan-ref: './client'
          - name: Run Trivy vulnerability scanner in fs mode for backend
            uses: aquasecurity/trivy-action@0.28.0
            with:
              scan-type: 'fs'
              scan-ref: './server'
    sonarqube:
        needs: leakscan
        runs-on: self-hosted
        steps:
          - name: Checkout code
            uses: actions/checkout@v4
          - name: Frontend SonarQube Scan
            uses: SonarSource/sonarqube-scan-action@v6.0.0
            env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
            with:
                projectBaseDir: ./client
          - name: Backend SonarQube Scan
            uses: SonarSource/sonarqube-scan-action@v6.0.0
            env:
                SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
                SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
            with:
                projectBaseDir: ./server
    checkout:
        runs-on: self-hosted
        needs: [trivyfs]
        steps:
            - name: Get code
              uses: actions/checkout@v4
            - name: Verify repo structure
              run: |
                echo "Repository contents:"
                ls -R
            - name: Upload source code
              uses: actions/upload-artifact@v4
              with:
                name: source-code
                path: .
    build:
        needs: checkout
        runs-on: self-hosted
        environment: Docker Credentials
        env:
          BACK_IMAGE: temp_server_image
          FRONT_IMAGE: temp_client_image
        steps:
            - name: Download source code
              uses: actions/download-artifact@v4
              with:
                name: source-code
                path: .
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            - name: Build Backend Image
              run: docker build -t ${{ env.BACK_IMAGE }}:latest -f ./server/Dockerfile ./server
            - name: Build Frontend Image
              run: docker build -t ${{ env.FRONT_IMAGE }}:latest -f ./client/Dockerfile ./client
            - name: Verify built images
              run: docker images
    trivyimage:
        needs: test
        runs-on: self-hosted
        continue-on-error: true
        env:
          BACK_IMAGE: temp_server_image
          FRONT_IMAGE: temp_client_image
        steps:
            - name: Load Docker images
              run: docker images

            - name: Run Trivy vulnerability scanner for backend image
              uses: aquasecurity/trivy-action@0.28.0
              with:
                image-ref: '${{ env.BACK_IMAGE }}:latest'
                format: 'table'
                exit-code: '0'
                ignore-unfixed: true
                vuln-type: 'os,library'
                severity: 'CRITICAL,HIGH'
            - name: Run Trivy vulnerability scanner for frontend image
              uses: aquasecurity/trivy-action@0.28.0
              with:
                image-ref: '${{ env.FRONT_IMAGE }}:latest'
                format: 'table'
                exit-code: '0'
                ignore-unfixed: true
                vuln-type: 'os,library'
                severity: 'CRITICAL,HIGH'
    test:
        # needs: trivyimage
        needs: build
        runs-on: self-hosted
        env:
          BACK_IMAGE: temp_server_image
          FRONT_IMAGE: temp_client_image
        steps:
            - name: Load Docker images
              run: docker images

            - name: Create network
              run: |
                    if ! docker network ls | grep -q "tempnet"; then
                      docker network create tempnet
                    fi
        
            - name: Run mysql container
              run: |
                  if docker ps -a | grep "mysql"; then
                    docker rm -f mysql
                  fi
                  docker run -d --name mysql --restart always --network tempnet -e MYSQL_ROOT_PASSWORD=rootpassword -e MYSQL_DATABASE=testDB -e MYSQL_USER=tempuser -e MYSQL_PASSWORD=changepwd -p 3306:3306 mysql:8.0

            - name: Run backend container
              run: |
                  if docker ps -a | grep "backend"; then
                    docker rm -f backend
                  fi
                  docker run -d --name backend --network tempnet -e PORT=80 -e DB_NAME=testDB -e DB_USER=tempuser -e DB_PASS=changepwd -e JWT_SECRET=supersecret -e DB_HOST=mysql -e DB_PORT=3306 -p 80:80 ${{ env.BACK_IMAGE }}

            - name: Run frontend container
              run: |
                  if docker ps -a | grep "frontend"; then
                    docker rm -f frontend
                  fi
                  docker run -d --name frontend -p 3000:3000 ${{ env.FRONT_IMAGE }}

            - name: Test backend health
              run: |
                  echo "Waiting for backend to be ready..."
                  for i in {1..20}; do
                    if docker exec backend curl -fs http://localhost:80/api/health; then
                      echo "✅ Backend is ready!"
                      break
                    fi
                    echo "⏳ Waiting..."
                    sleep 3
                  done
            - name: Test frontend accessibility
              run: |
                echo "Waiting for frontend to start..."
                sleep 10
                curl -f http://localhost:3000 || (echo "❌ Frontend not responding!" && exit 1)

            # - name: Stop and remove containers
            #   if: always()
