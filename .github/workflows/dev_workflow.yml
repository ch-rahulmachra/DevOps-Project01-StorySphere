name: Development Workflow
on:
    push:
        branches:
            - dev
    workflow_dispatch:
jobs:
    leakscan:
        runs-on: self-hosted
        steps:
          - name: Get code
            uses: actions/checkout@v4
          - uses: gitleaks/gitleaks-action@v2
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE}}
    trivyfs:
        needs: leakscan
        runs-on: self-hosted
        steps:
          - name: Checkout code
            uses: actions/checkout@v4
          - name: Run Trivy vulnerability scanner in fs mode for frontend
            uses: aquasecurity/trivy-action@0.28.0
            with:
              scan-type: 'fs'
              scan-ref: './client'
          - name: Run Trivy vulnerability scanner in fs mode for backend
            uses: aquasecurity/trivy-action@0.28.0
            with:
              scan-type: 'fs'
              scan-ref: './server'
    checkout:
        runs-on: self-hosted
        needs: trivyfs
        steps:
            - name: Get code
              uses: actions/checkout@v4
            - name: Verify repo structure
              run: |
                echo "Repository contents:"
                ls -R
            - name: Upload source code
              uses: actions/upload-artifact@v4
              with:
                name: source-code
                path: .
    build:
        needs: checkout
        runs-on: self-hosted
        environment: Docker Credentials
        env:
          BACK_IMAGE: temp_server_image
          FRONT_IMAGE: temp_client_image
        steps:
            - name: Download source code
              uses: actions/download-artifact@v4
              with:
                name: source-code
                path: .
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            - name: Build Backend Image
              run: |
                mkdir docker_image
                cd docker_image
                docker build -t ${{ env.BACK_IMAGE }}:latest -f ./server/Dockerfile ./server
            - name: Build Frontend Image
              run: |
                cd docker_image
                docker build -t ${{ env.FRONT_IMAGE }}:latest -f ./client/Dockerfile ./client
            - name: Verify built images
              run: docker images
    trivyimage:
        needs: build
        runs-on: self-hosted
        steps:
            - name: Load Docker images
              run: |
                cd docker_image
                docker images

            - name: Run Trivy vulnerability scanner for backend image
              uses: aquasecurity/trivy-action@0.28.0
              with:
                image-ref: '${{ env.BACK_IMAGE }}'
                format: 'table'
                exit-code: '1'
                ignore-unfixed: true
                vuln-type: 'os,library'
                severity: 'CRITICAL,HIGH'
            - name: Run Trivy vulnerability scanner for frontend image
              uses: aquasecurity/trivy-action@0.28.0
              with:
                image-ref: '${{ env.FRONT_IMAGE }}'
                format: 'table'
                exit-code: '1'
                ignore-unfixed: true
                vuln-type: 'os,library'
                severity: 'CRITICAL,HIGH'
    test:
        needs: trivyimage
        runs-on: self-hosted
        steps:
            - name: Load Docker images
              run: |
                cd docker_image
                docker images
            
            - name: Run backend container
              run: docker run -d --name backend -p 5000:5000 ${{ env.BACK_IMAGE }}

            - name: Run frontend container
              run: docker run -d --name frontend -p 3000:3000 ${{ env.FRONT_IMAGE }}

            - name: Test backend health
              run: |
                echo "Waiting for backend to start..."
                sleep 10
                curl -f http://localhost:5000/api/health || (echo "❌ Backend health check failed!" && exit 1)

            - name: Test frontend accessibility
              run: |
                echo "Waiting for frontend to start..."
                sleep 10
                curl -f http://localhost:3000 || (echo "❌ Frontend not responding!" && exit 1)

            # - name: Stop and remove containers
            #   if: always()
